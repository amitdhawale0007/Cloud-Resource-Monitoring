<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" />

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0B132B" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Logo -->
  <circle cx="50" cy="35" r="14" fill="#06B6D4" opacity="0.2" />
  <path d="M42 35 C42 30 46 26 51 26 C55 26 58 29 59 32 C62 32 64 34 64 37 C64 40 61 42 58 42 L44 42 C41 42 39 40 39 37 C39 35 41 33 43 33" stroke="#38BDF8" stroke-width="2" fill="none" />
  <text x="75" y="41" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="700" font-size="18">PulseCloud</text>
  <rect x="175" y="27" width="65" height="18" rx="4" fill="#06B6D4" fill-opacity="0.15" />
  <text x="183" y="40" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="10">MONITOR</text>

  <!-- Top Header Controls Mockup -->
  <rect x="760" y="22" width="130" height="28" rx="6" fill="#111C38" stroke="#1E293B" />
  <text x="772" y="40" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Last 15 Minutes ▾</text>

  <rect x="905" y="22" width="75" height="28" rx="6" fill="#111C38" stroke="#1E293B" />
  <circle cx="918" cy="36" r="4" fill="#10B981" />
  <text x="928" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Pause</text>

  <rect x="990" y="22" width="80" height="28" rx="6" fill="#111C38" stroke="#1E293B" />
  <text x="1002" y="40" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">↻ Refresh</text>

  <circle cx="1095" cy="36" r="14" fill="#111C38" stroke="#1E293B" />
  <path d="M1095 29 A7 7 0 1 1 1088 36 A6 6 0 0 0 1095 29 Z" fill="#F8FAFC" />

  <circle cx="1135" cy="36" r="14" fill="#111C38" stroke="#1E293B" />
  <circle cx="1143" cy="28" r="5" fill="#EF4444" />
  <text x="1141" y="31" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="8">1</text>

  <!-- Sidebar -->
  <rect x="0" y="70" width="220" height="605" fill="#0B132B" />
  <line x1="220" y1="70" x2="220" y2="675" stroke="#1E293B" stroke-width="1.5" />

  <!-- Nav Links -->
  <rect x="15" y="95" width="190" height="38" rx="6" fill="url(#cyanGrad)" fill-opacity="0.2" />
  <line x1="15" y1="95" x2="15" y2="133" stroke="#06B6D4" stroke-width="3" />
  <text x="45" y="119" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="14">Overview</text>

  <text x="45" y="160" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="14">Servers (8)</text>
  <text x="45" y="200" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="14">Live Telemetry</text>
  <text x="45" y="240" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="14">Alert Center</text>
  <rect x="165" y="227" width="22" height="16" rx="8" fill="#EF4444" fill-opacity="0.2" />
  <text x="173" y="239" fill="#EF4444" font-family="'Inter', sans-serif" font-weight="700" font-size="10">1</text>
  <text x="45" y="280" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="14">Architecture</text>

  <!-- Content Banner -->
  <rect x="245" y="90" width="925" height="36" rx="6" fill="#111C38" stroke="#06B6D4" stroke-opacity="0.3" />
  <circle cx="265" cy="108" r="4" fill="#06B6D4" />
  <text x="280" y="112" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Simulated Cloud Telemetry Active: Real-time bounded random-walk engine. AWS CloudWatch Adapter ready.</text>

  <!-- 6 Metric Cards -->
  <!-- Card 1: CPU -->
  <rect x="245" y="140" width="295" height="110" rx="10" fill="#111C38" stroke="#1E293B" />
  <text x="265" y="165" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">CPU USAGE</text>
  <text x="265" y="205" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="30" font-weight="800">42.5%</text>
  <rect x="265" y="220" width="255" height="6" rx="3" fill="#0E172E" />
  <rect x="265" y="220" width="108" height="6" rx="3" fill="url(#cyanGrad)" />

  <!-- Card 2: Memory -->
  <rect x="560" y="140" width="295" height="110" rx="10" fill="#111C38" stroke="#1E293B" />
  <text x="580" y="165" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">MEMORY USAGE</text>
  <text x="580" y="205" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="30" font-weight="800">61.8%</text>
  <rect x="580" y="220" width="255" height="6" rx="3" fill="#0E172E" />
  <rect x="580" y="220" width="157" height="6" rx="3" fill="url(#purpleGrad)" />

  <!-- Card 3: Status -->
  <rect x="875" y="140" width="295" height="110" rx="10" fill="#111C38" stroke="#1E293B" />
  <text x="895" y="165" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">FLEET STATUS</text>
  <text x="895" y="205" fill="#10B981" font-family="'Inter', sans-serif" font-size="28" font-weight="800">ONLINE</text>
  <circle cx="1025" cy="195" r="5" fill="#10B981" />
  <text x="895" y="230" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">7 Online • 1 Warning • 0 Critical</text>

  <!-- Big Visual Chart Panel -->
  <rect x="245" y="265" width="610" height="385" rx="10" fill="#111C38" stroke="#1E293B" />
  <text x="265" y="295" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Real-time Resource Utilization</text>
  <text x="265" y="315" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Combined CPU &amp; Memory Trendline (Chart.js Hardware Accelerated)</text>

  <!-- Chart Curve Mockup -->
  <path d="M 270 550 Q 350 480 430 500 T 580 420 T 730 460 T 830 380" fill="none" stroke="#38BDF8" stroke-width="3" filter="url(#glow)" />
  <path d="M 270 510 Q 360 440 450 460 T 600 390 T 740 410 T 830 340" fill="none" stroke="#A855F7" stroke-width="3" />

  <!-- Side Table/Alerts Preview -->
  <rect x="875" y="265" width="295" height="385" rx="10" fill="#111C38" stroke="#1E293B" />
  <text x="895" y="295" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16" font-weight="700">System Incidents</text>
  <text x="895" y="315" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Threshold-driven Alerts</text>

  <!-- Incident 1 -->
  <rect x="890" y="335" width="265" height="65" rx="6" fill="#0E172E" stroke="#F59E0B" stroke-width="1.5" />
  <text x="905" y="355" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="11" font-weight="700">WARNING: HIGH CPU &amp; RAM</text>
  <text x="905" y="372" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">eu-west-1-db-primary at 82.4% CPU</text>
  <text x="905" y="388" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">2 mins ago • Auto-deduplicated</text>

  <!-- Incident 2 -->
  <rect x="890" y="415" width="265" height="65" rx="6" fill="#0E172E" stroke="#10B981" stroke-width="1.5" />
  <text x="905" y="435" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">RESOLVED: RECOVERY</text>
  <text x="905" y="452" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">us-west-2-auth-srv normalized</text>
  <text x="905" y="468" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">8 mins ago • Normal range</text>
</svg>
